version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: quizmaker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quizmaker
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: quizmaker
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - quizmaker_network

  # PHP-FPM for Laravel Backend
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: quizmaker_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      DB_HOST: db
      DB_DATABASE: quizmaker
      DB_USERNAME: quizmaker
      DB_PASSWORD: password
    depends_on:
      - db
    networks:
      - quizmaker_network

  # Nginx for Backend API
  nginx_backend:
    image: nginx:alpine
    container_name: quizmaker_nginx_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - quizmaker_network

  # Nuxt.js Frontend
  frontend:
    image: node:16-alpine
    container_name: quizmaker_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - HOST=0.0.0.0
      - API_URL=http://nginx_backend
    depends_on:
      - nginx_backend
    networks:
      - quizmaker_network

  # Next.js Admin Panel
  admin:
    image: node:16-alpine
    container_name: quizmaker_admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - API_URL=http://nginx_backend
    depends_on:
      - nginx_backend
    networks:
      - quizmaker_network

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: quizmaker_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: quizmaker
      PMA_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db
    networks:
      - quizmaker_network

networks:
  quizmaker_network:
    driver: bridge

volumes:
  mysql_data:
